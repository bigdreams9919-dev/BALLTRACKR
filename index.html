<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BallTrackr</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header>
      <p class="welcome">Welcome back 👋</p>
      <h1>BallTrackr</h1>
      <p class="subtitle">Track your development. Become a better player.</p>
    </header>

    <section class="streak">
      <div>
        <p>Training streak</p>
        <h2>🔥 6 days</h2>
      </div>
      <span>Keep going.</span>
    </section>

    <section>
      <h2 class="section-title">Today's Training</h2>

      <div class="training-card">
        <div>
          <p class="tag">TECHNICAL</p>
          <h2>First Touch & Control</h2>
          <p>20 minutes · 4 drills</p>
        </div>

        <button>Start</button>
      </div>
    </section>

    <section>
      <h2 class="section-title">Your Progress</h2>

      <div class="stats">
        <div class="stat">
          <strong>72%</strong>
          <span>Ball Control</span>
        </div>

        <div class="stat">
          <strong>68%</strong>
          <span>Passing</span>
        </div>

        <div class="stat">
          <strong>61%</strong>
          <span>Dribbling</span>
        </div>
      </div>
    </section>

    <nav>
      <a class="active">⌂<span>Home</span></a>
      <a>⚽<span>Training</span></a>
      <a>◈<span>Progress</span></a>
      <a>◯<span>Profile</span></a>
    </nav>

  </main>

</body>
</html>
